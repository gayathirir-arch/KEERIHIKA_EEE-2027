<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Level 1 Task 1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color:#E1C16E;
        }

        /* Navigation Menu */
        nav {
            background-color:#CD7F32;
            padding: 15px;
        }

        nav a {
            color:#6F4E37;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* Main Content */
        .container {
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #6F4E37;
        }

        p {
            font-size: 16px;
            color: #555;
        }

        img {
            width: 250px;
            margin: 20px 0;
            border-radius: 10px;
        }

        /* Form */
        form {
            margin-top: 30px;
        }

        input[type="text"] {
            padding: 10px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"] {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }

        input[type="submit"]:hover {
            background-color:#3D130A;
        }
    </style>
</head>

<body>

    <!-- Navigation Menu -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h1>Welcome to My Webpage</h1>

        <p>
            This is a simple webpage created using HTML and CSS as part of Level 1 Task 1.
        </p>

        <img src="https://via.placeholder.com/250" alt="Sample Image">

        <!-- Basic Form -->
        <form>
            <input type="text" placeholder="Enter your name" required>
            <input type="submit" value="Submit">
        </form>
    </div>

</body>
</html>
